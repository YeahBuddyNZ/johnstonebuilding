# Publish the static site to GitHub Pages.
#
# This runs on demand only. The site is hosted on Netlify, so leaving a push
# trigger here would fail on every commit — GitHub Pages has to be switched on
# in repository settings before this workflow can do anything, and turning it on
# would also publish a second copy of the site at a github.io address.
#
# To use GitHub Pages instead of Netlify:
#   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   2. Add `push: {branches: [main]}` back under `on:` below
#   3. Add a CNAME file if you want the custom domain
# Until then, run it by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
